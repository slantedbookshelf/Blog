  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(10px, 4vw, 56px);
      background: #173c3c;
      font-family: system-ui, sans-serif;
    }
    main {
      position: relative;
      width: min(100%, 1040px);
      overflow: hidden;
      border: 1px solid #fff0ce55;
      border-radius: clamp(14px, 3vw, 28px);
      background: #f4d39d;
      box-shadow: 0 24px 64px #071f2266;
    }
    svg { display: block; width: 100%; height: auto; }
    button {
      position: absolute;
      right: clamp(9px, 2vw, 22px);
      bottom: clamp(9px, 2vw, 22px);
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid #fff5d994;
      border-radius: 50%;
      background: #173c3c;
      color: #fff5dd;
      cursor: pointer;
    }
    button[hidden] { display: none; }
    button:hover { background: #285654; }
    button:focus-visible { outline: 2px solid #fff5dd; outline-offset: 3px; }
    button svg { width: 18px; height: 18px; }
    button .play, button.is-paused .pause { display: none; }
    button.is-paused .play { display: initial; }

  <script>
    const scene = document.querySelector('#ride');
    const motionButton = document.querySelector('#motion');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

    function setPaused(paused) {
      if (paused) {
        scene.pauseAnimations();
      } else {
        scene.unpauseAnimations();
      }

      const label = paused ? '播放动画' : '暂停动画';
      motionButton.classList.toggle('is-paused', paused);
      motionButton.setAttribute('aria-label', label);
      motionButton.title = label;
    }

    setPaused(reducedMotion.matches);
    motionButton.hidden = false;

    motionButton.addEventListener('click', () => {
      setPaused(!scene.animationsPaused());
    });
    reducedMotion.addEventListener('change', (event) => setPaused(event.matches));
  </script>
